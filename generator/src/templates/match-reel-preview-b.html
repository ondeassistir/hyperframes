<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Preview B (Whip Pan) — Botafogo x Chapecoense</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        background: #111;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 24px;
        min-height: 100vh;
      }

      /* Scale wrapper: 1080×1920 → ~45% for browser preview */
      .preview-shell {
        width: 486px;
        height: 864px;
        overflow: hidden;
        position: relative;
        flex-shrink: 0;
        border-radius: 8px;
        box-shadow: 0 0 0 1px #333, 0 24px 64px #000a;
      }

      .preview-shell > [data-composition-id] {
        transform: scale(0.45);
        transform-origin: top left;
        position: absolute;
        top: 0;
        left: 0;
      }
    </style>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      [data-composition-id="match-reel"] {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        position: relative;
        font-family: "Sora", sans-serif;
        color: hsl(210 40% 98%);
        background: hsl(215 28% 7%);
      }

      .scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      #scene1 { z-index: 2; }
      #scene2 { z-index: 1; opacity: 0; }

      .scene-bg {
        position: absolute;
        inset: 0;
        transform-origin: center center;
        background:
          radial-gradient(ellipse 900px 500px at 50% -60px, hsl(270 100% 50% / 0.12) 0%, transparent 70%),
          linear-gradient(180deg, hsl(215 28% 7%) 0%, hsl(215 28% 5%) 100%);
        z-index: 0;
      }

      .intro-center {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
      }

      #oa-logo-intro { width: 160px; height: auto; }
      #tagline-intro { font-size: 48px; font-weight: 700; color: hsl(210 40% 98%); letter-spacing: 2px; }

      .layout {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        padding: 120px 80px 100px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        overflow: hidden;
      }

      #league-row { display: flex; align-items: center; gap: 20px; margin-bottom: 72px; width: 100%; }
      #league-logo { width: 56px; height: 56px; object-fit: contain; flex-shrink: 0; }
      #league-info { display: flex; flex-direction: column; gap: 6px; flex: 1; }
      #league-name { font-size: 32px; font-weight: 700; color: hsl(210 40% 98%); }
      #round-label { font-size: 24px; font-weight: 400; color: hsl(215 20% 65%); }
      #app-icon { width: 100px; height: 100px; object-fit: contain; flex-shrink: 0; }

      #home-row, #away-row { display: flex; align-items: center; gap: 28px; margin-bottom: 24px; width: 100%; }
      #home-logo, #away-logo { width: 96px; height: 96px; object-fit: contain; flex-shrink: 0; }
      #home-name, #away-name { font-size: 64px; font-weight: 700; color: hsl(210 40% 98%); line-height: 1.1; }

      #divider-rule, #divider-rule-2 { width: 100%; height: 1px; background: hsl(215 25% 18%); margin-bottom: 56px; flex-shrink: 0; }
      #divider-rule { margin-top: 16px; }

      #kickoff-time { font-size: 64px; font-weight: 700; color: hsl(210 40% 98%); letter-spacing: -3px; line-height: 1; margin-bottom: 12px; display: block; }
      #kickoff-date { font-size: 32px; font-weight: 500; color: hsl(215 20% 65%); margin-bottom: 48px; display: block; }

      #channels-label { font-size: 32px; font-weight: 600; letter-spacing: 0px; color: hsl(142 70% 50%); margin-bottom: 48px; display: block; }

      #channels-list { display: flex; flex-direction: column; gap: 20px; margin-bottom: 52px; width: 100%; }

      .channel-item { display: flex; align-items: center; gap: 20px; width: 100%; }
      .channel-logo { width: 96px; height: 104px; object-fit: contain; flex-shrink: 0; border-radius: 20px; }
      .channel-name { font-size: 32px; font-weight: 700; color: hsl(210 40% 98%); }
      .free-badge { font-size: 20px; font-weight: 600; color: hsl(142 70% 50%); background: hsl(142 70% 50% / 0.12); border: 1px solid hsl(142 70% 50% / 0.3); border-radius: 999px; padding: 4px 16px; margin-left: auto; flex-shrink: 0; }

      #app-cta { display: flex; flex-direction: column; gap: 40px; align-items: flex-start; }
      #cta-text { font-size: 32px; font-weight: 600; color: hsl(210 40% 98%); display: block; }
      #gplay-badge { height: 80px; width: auto; }

      #oa-footer { position: absolute; bottom: 72px; left: 80px; right: 80px; display: flex; align-items: center; gap: 20px; z-index: 2; }
      .footer-logo-img { height: 56px; width: auto; opacity: 0.7; }
      .footer-domain { font-size: 32px; font-weight: 600; color: hsl(270 100% 68%); }
    </style>
  </head>
  <body>
    <div class="preview-shell">
      <div
        data-composition-id="match-reel"
        data-duration="12"
        data-fps="30"
        data-width="1080"
        data-height="1920"
      >
        <!-- Scene 1: Brand logo intro -->
        <div id="scene1" class="scene">
          <div class="scene-bg"></div>
          <div class="intro-center">
            <img
              id="oa-logo-intro"
              src="https://imagedelivery.net/d9gC2EGekkZoINfC-sskXg/ui/logo-roxo.svg/public"
              alt="Onde Assistir"
            />
            <p id="tagline-intro">Onde Assistir Futebol Ao Vivo</p>
          </div>
        </div>

        <!-- Scene 2: Match info -->
        <div id="scene2" class="scene">
          <div class="scene-bg"></div>

          <div class="layout">
            <div id="league-row">
              <img
                id="league-logo"
                src="https://imagedelivery.net/d9gC2EGekkZoINfC-sskXg/leagues/1772677320167-73.png/public"
                alt="Liga"
              />
              <div id="league-info">
                <span id="league-name">COPA DO BRASIL</span>
                <span id="round-label">Round of 32</span>
              </div>
              <img
                id="app-icon"
                src="https://imagedelivery.net/d9gC2EGekkZoINfC-sskXg/ui/ic_launcher-playstore-reel.png/public"
                alt=""
              />
            </div>

            <div id="home-row">
              <img
                id="home-logo"
                src="https://imagedelivery.net/d9gC2EGekkZoINfC-sskXg/teams/120.png/public"
                alt="Botafogo"
              />
              <span id="home-name">Botafogo</span>
            </div>
            <div id="away-row">
              <img
                id="away-logo"
                src="https://imagedelivery.net/d9gC2EGekkZoINfC-sskXg/teams/132.png/public"
                alt="Chapecoense"
              />
              <span id="away-name">Chapecoense</span>
            </div>

            <div id="divider-rule"></div>

            <span id="kickoff-time">17:00h</span>
            <span id="kickoff-date">Terça-feira, 21 de abril</span>

            <div id="divider-rule-2"></div>

            <span id="channels-label">Onde Assistir Ao Vivo</span>
            <div id="channels-list">
              <div class="channel-item">
                <img src="https://img.ondeassistir.tv/images-scr/channels/primevideo.png" alt="Amazon Prime" class="channel-logo" />
                <span class="channel-name">Amazon Prime</span>
              </div>
              <div class="channel-item">
                <img src="https://img.ondeassistir.tv/images-scr/channels/sportv.png" alt="SporTV" class="channel-logo" />
                <span class="channel-name">SporTV</span>
              </div>
              <div class="channel-item">
                <img src="https://img.ondeassistir.tv/images-scr/channels/premiere.png" alt="Premiere" class="channel-logo" />
                <span class="channel-name">Premiere</span>
              </div>
            </div>

            <div id="app-cta">
              <span id="cta-text">Baixe o app! 100% Grátis</span>
              <img
                id="gplay-badge"
                src="https://imagedelivery.net/d9gC2EGekkZoINfC-sskXg/ui/googleplay-badge.svg/public"
                alt="Disponível no Google Play"
              />
            </div>
          </div>

          <div id="oa-footer">
            <img
              class="footer-logo-img"
              src="https://img.ondeassistir.tv/images-scr/favicon/favicon.svg"
              alt="Onde Assistir"
            />
            <span class="footer-domain">www.ondeassistir.tv</span>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      var tl = gsap.timeline();

      // ── Phase 1: 3D logo flip ──

      // Park dividers invisible from frame 0 so they never flash during transition
      tl.set("#divider-rule, #divider-rule-2", { scaleX: 0, transformOrigin: "left center" }, 0);

      tl.set("#oa-logo-intro", { rotationY: -90, opacity: 0, transformPerspective: 600 }, 0);
      tl.to("#oa-logo-intro", { rotationY: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.15);
      tl.fromTo("#tagline-intro", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 1.0, ease: "power2.out" }, 0.9);

      // Intro fades out cleanly before the whip starts
      tl.to("#oa-logo-intro, #tagline-intro", { opacity: 0, duration: 0.25, ease: "power2.in" }, 1.55);

      // ── Phase 2: Whip pan transition ──────────────────────────────────────
      //
      // Scene 2 whips in from the right over an already-clear scene 1
      //
      var T = 1.8;

      // Raise scene2 above scene1, position it off-right, already blurred
      tl.set("#scene2", { opacity: 1, x: 220, filter: "blur(40px)", zIndex: 3 }, T);

      // Scene2: fast whip into position, blur clears
      tl.to("#scene2", {
        x: 0,
        filter: "blur(0px)",
        duration: 0.2,
        ease: "power3.out",
      }, T + 0.04);

      // Scene1: hide once scene2 is settled
      tl.set("#scene1", { opacity: 0 }, T + 0.5);

      // ── Phase 3: Scene 2 build — overlaps tail of whip for seamless feel ──
      var S = T + 0.1;

      tl.fromTo("#league-row", { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, S);
      tl.fromTo("#home-row", { x: -50, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, S + 0.2);
      tl.fromTo("#away-row", { x: -50, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, S + 0.32);
      tl.to("#divider-rule", { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, S + 0.45);
      tl.fromTo("#kickoff-time", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, S + 0.65);
      tl.fromTo("#kickoff-date", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, S + 0.9);
      tl.to("#divider-rule-2", { scaleX: 1, duration: 0.4, ease: "power2.inOut" }, S + 1.1);
      tl.fromTo("#channels-label", { x: -25, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, S + 1.25);
      tl.fromTo(".channel-item", { x: -35, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, S + 1.4);
      tl.fromTo("#app-cta", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, S + 2.1);
      tl.fromTo("#oa-footer", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.out" }, S + 2.4);

      // ── Phase 4: Breathe ──
      tl.to("#scene2 .scene-bg", { scale: 1.06, duration: 3.5, ease: "sine.inOut", yoyo: true, repeat: -1 }, S + 2.4);

      window.__timelines["match-reel"] = tl;
    </script>
  </body>
</html>
