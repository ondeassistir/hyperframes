<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Preview — Botafogo x Chapecoense-sc</title>
    <style>
      body {
        margin: 0;
        background: #111;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 24px;
        min-height: 100vh;
      }

      /* Scale wrapper: 1080×1920 → ~45% for browser preview */
      .preview-shell {
        width: 486px;
        height: 864px;
        overflow: hidden;
        position: relative;
        flex-shrink: 0;
        border-radius: 8px;
        box-shadow: 0 0 0 1px #333, 0 24px 64px #000a;
      }

      .preview-shell > [data-composition-id] {
        transform: scale(0.45);
        transform-origin: top left;
        position: absolute;
        top: 0;
        left: 0;
      }

      /* ── Composition styles ── */
      @import url("https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap");
    </style>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      [data-composition-id="match-reel"] {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        position: relative;
        font-family: "Sora", sans-serif;
        color: hsl(210 40% 98%);
        background: hsl(215 28% 7%);
      }

      #wipe-a,
      #wipe-b {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        z-index: 100;
        pointer-events: none;
      }

      #wipe-a { background: hsl(270 100% 50%); }
      #wipe-b { background: hsl(262 80% 40%); }

      .scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      #scene1 { z-index: 2; }
      #scene2 { z-index: 1; opacity: 0; }

      .scene-bg {
        position: absolute;
        inset: 0;
        transform-origin: center center;
        background:
          radial-gradient(ellipse 900px 500px at 50% -60px, hsl(270 100% 50% / 0.12) 0%, transparent 70%),
          linear-gradient(180deg, hsl(215 28% 7%) 0%, hsl(215 28% 5%) 100%);
        z-index: 0;
      }

      .intro-center {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
      }

      #oa-logo-intro { width: 160px; height: auto; }
      #tagline-intro { font-size: 48px; font-weight: 700; color: hsl(210 40% 98%); letter-spacing: 2px; }

      .layout {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        padding: 120px 80px 100px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        overflow: hidden;
      }

      #league-row { display: flex; align-items: center; gap: 20px; margin-bottom: 16px; }
      #league-logo { width: 56px; height: 56px; object-fit: contain; flex-shrink: 0; }
      #league-name { font-size: 32px; font-weight: 500; color: hsl(210 40% 98%); }

      #round-label { font-size: 24px; font-weight: 400; color: hsl(215 20% 65%); margin-bottom: 72px; display: block; }

      #home-row, #away-row { display: flex; align-items: center; gap: 28px; margin-bottom: 24px; width: 100%; }
      #home-logo, #away-logo { width: 96px; height: 96px; object-fit: contain; flex-shrink: 0; }
      #home-name, #away-name { font-size: 52px; font-weight: 700; color: hsl(210 40% 98%); line-height: 1.1; }

      #divider-rule, #divider-rule-2 { width: 100%; height: 1px; background: hsl(215 25% 18%); margin-bottom: 36px; flex-shrink: 0; }
      #divider-rule { margin-top: 16px; }

      #kickoff-time { font-size: 108px; font-weight: 700; color: hsl(210 40% 98%); letter-spacing: -3px; line-height: 1; margin-bottom: 12px; display: block; }
      #kickoff-date { font-size: 32px; font-weight: 500; color: hsl(215 20% 65%); margin-bottom: 48px; display: block; }

      #channels-label { font-size: 22px; font-weight: 600; text-transform: uppercase; letter-spacing: 4px; color: hsl(270 100% 70%); margin-bottom: 28px; display: block; }

      #channels-list { display: flex; flex-direction: column; gap: 20px; margin-bottom: 52px; width: 100%; }

      .channel-item { display: flex; align-items: center; gap: 20px; width: 100%; }
      .channel-logo { width: 52px; height: 52px; object-fit: contain; flex-shrink: 0; }
      .channel-name { font-size: 28px; font-weight: 500; color: hsl(210 40% 98%); }
      .free-badge { font-size: 20px; font-weight: 600; color: hsl(142 70% 50%); background: hsl(142 70% 50% / 0.12); border: 1px solid hsl(142 70% 50% / 0.3); border-radius: 999px; padding: 4px 16px; margin-left: auto; flex-shrink: 0; }

      #app-cta { display: flex; flex-direction: column; gap: 20px; }
      #cta-text { font-size: 30px; font-weight: 600; color: hsl(210 40% 98%); display: block; }
      #gplay-badge { display: inline-flex; align-items: center; gap: 16px; background: hsl(215 25% 14%); border: 1px solid hsl(215 25% 22%); border-radius: 12px; padding: 16px 28px; }
      .play-icon { font-size: 28px; color: hsl(270 100% 68%); line-height: 1; }
      .badge-text { display: flex; flex-direction: column; gap: 2px; }
      .badge-sub { font-size: 18px; font-weight: 400; color: hsl(215 20% 65%); }
      .badge-main { font-size: 26px; font-weight: 600; color: hsl(210 40% 98%); }

      #oa-footer { position: absolute; bottom: 72px; left: 80px; right: 80px; display: flex; align-items: center; gap: 20px; z-index: 2; }
      .footer-logo-img { height: 32px; width: auto; opacity: 0.7; }
      .footer-domain { font-size: 26px; font-weight: 600; color: hsl(270 100% 68%); }
    </style>
  </head>
  <body>
    <div class="preview-shell">
      <div
        data-composition-id="match-reel"
        data-duration="12"
        data-fps="30"
        data-width="1080"
        data-height="1920"
      >
        <div id="wipe-a"></div>
        <div id="wipe-b"></div>

        <!-- Scene 1: Brand logo intro -->
        <div id="scene1" class="scene">
          <div class="scene-bg"></div>
          <div class="intro-center">
            <img
              id="oa-logo-intro"
              src="https://img.ondeassistir.tv/images-scr/favicon/favicon.svg"
              alt="Onde Assistir"
            />
            <p id="tagline-intro">Onde Assistir</p>
          </div>
        </div>

        <!-- Scene 2: Match info — Copa do Brasil · Botafogo x Chapecoense-sc -->
        <div id="scene2" class="scene">
          <div class="scene-bg"></div>

          <div class="layout">
            <div id="league-row">
              <img
                id="league-logo"
                src="https://imagedelivery.net/d9gC2EGekkZoINfC-sskXg/leagues/73.png/public"
                alt="Liga"
              />
              <span id="league-name">COPA DO BRASIL</span>
            </div>
            <span id="round-label">Round of 32</span>

            <div id="home-row">
              <img
                id="home-logo"
                src="https://imagedelivery.net/d9gC2EGekkZoINfC-sskXg/teams/120.png/public"
                alt="Botafogo"
              />
              <span id="home-name">Botafogo</span>
            </div>
            <div id="away-row">
              <img
                id="away-logo"
                src="https://imagedelivery.net/d9gC2EGekkZoINfC-sskXg/teams/132.png/public"
                alt="Chapecoense-sc"
              />
              <span id="away-name">Chapecoense-sc</span>
            </div>

            <div id="divider-rule"></div>

            <span id="kickoff-time">17:00h</span>
            <span id="kickoff-date">Terça-feira, 21 de abril</span>

            <div id="divider-rule-2"></div>

            <span id="channels-label">Onde assistir</span>
            <div id="channels-list">
              <div class="channel-item">
                <img src="https://img.ondeassistir.tv/images-scr/channels/primevideo.png" alt="Amazon Prime" class="channel-logo" />
                <span class="channel-name">Amazon Prime</span>
              </div>
              <div class="channel-item">
                <img src="https://img.ondeassistir.tv/images-scr/channels/sportv.png" alt="SporTV" class="channel-logo" />
                <span class="channel-name">SporTV</span>
              </div>
              <div class="channel-item">
                <img src="https://img.ondeassistir.tv/images-scr/channels/premiere.png" alt="Premiere" class="channel-logo" />
                <span class="channel-name">Premiere</span>
              </div>
            </div>

            <div id="app-cta">
              <span id="cta-text">Baixe o app! 100% Grátis</span>
              <div id="gplay-badge">
                <span class="play-icon">&#9654;</span>
                <div class="badge-text">
                  <span class="badge-sub">Disponível no</span>
                  <span class="badge-main">Google Play</span>
                </div>
              </div>
            </div>
          </div>

          <div id="oa-footer">
            <img
              class="footer-logo-img"
              src="https://img.ondeassistir.tv/images-scr/favicon/favicon.svg"
              alt="Onde Assistir"
            />
            <span class="footer-domain">ondeassistir.tv</span>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      // Preview: autoplay (remove paused:true used by HyperFrames engine)
      var tl = gsap.timeline();

      // ── Phase 1: 3D logo flip ──
      tl.set("#oa-logo-intro", { rotationY: -90, opacity: 0, transformPerspective: 600 }, 0);
      tl.to("#oa-logo-intro", { rotationY: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.15);
      tl.fromTo("#tagline-intro", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.7);

      // ── Phase 2: Cover transition ──
      var T = 1.8;
      tl.set("#wipe-a", { x: -1080 }, T - 0.01);
      tl.set("#wipe-b", { x: -1080 }, T - 0.01);
      tl.to("#wipe-a", { x: 0, duration: 0.25, ease: "power3.inOut" }, T);
      tl.to("#wipe-b", { x: 0, duration: 0.25, ease: "power3.inOut" }, T + 0.06);
      tl.set("#scene1", { opacity: 0 }, T + 0.2);
      tl.set("#scene2", { opacity: 1 }, T + 0.2);
      tl.to("#wipe-a", { x: 1080, duration: 0.25, ease: "power3.inOut" }, T + 0.28);
      tl.to("#wipe-b", { x: 1080, duration: 0.25, ease: "power3.inOut" }, T + 0.34);

      // ── Phase 3: Scene 2 build ──
      var S = 2.4;
      tl.fromTo("#league-row", { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, S + 0.1);
      tl.fromTo("#round-label", { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, S + 0.25);
      tl.fromTo("#home-row", { x: -50, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, S + 0.45);
      tl.fromTo("#away-row", { x: -50, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, S + 0.57);
      tl.set("#divider-rule", { scaleX: 0, transformOrigin: "left center" }, S);
      tl.to("#divider-rule", { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, S + 0.7);
      tl.fromTo("#kickoff-time", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, S + 0.9);
      tl.fromTo("#kickoff-date", { x: -20, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, S + 1.15);
      tl.set("#divider-rule-2", { scaleX: 0, transformOrigin: "left center" }, S);
      tl.to("#divider-rule-2", { scaleX: 1, duration: 0.4, ease: "power2.inOut" }, S + 1.35);
      tl.fromTo("#channels-label", { x: -25, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, S + 1.5);
      tl.fromTo(".channel-item", { x: -35, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power2.out", stagger: 0.1 }, S + 1.65);
      tl.fromTo("#app-cta", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, S + 2.5);
      tl.fromTo("#oa-footer", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.out" }, S + 2.8);

      // ── Phase 4: Breathe ──
      tl.to("#scene2 .scene-bg", { scale: 1.06, duration: 3.5, ease: "sine.inOut", yoyo: true, repeat: -1 }, S + 2.8);

      window.__timelines["match-reel"] = tl;
    </script>
  </body>
</html>
