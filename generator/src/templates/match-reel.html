<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>{{HOME_TEAM}} x {{AWAY_TEAM}}</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap");

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: hsl(215 28% 7%);
      }

      [data-composition-id="match-reel"] {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        position: relative;
        font-family: "Sora", sans-serif;
        color: hsl(210 40% 98%);
        background: hsl(215 28% 7%);
      }

      /* ── Wipe blocks (above all scenes) ── */
      #wipe-a,
      #wipe-b {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        z-index: 100;
        pointer-events: none;
      }

      #wipe-a {
        background: hsl(270 100% 50%);
      }

      #wipe-b {
        background: hsl(262 80% 40%);
      }

      /* ── Scenes ── */
      .scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      #scene1 {
        z-index: 2;
      }

      #scene2 {
        z-index: 1;
        opacity: 0;
      }

      /* ── Shared scene background ── */
      .scene-bg {
        position: absolute;
        inset: 0;
        transform-origin: center center;
        background:
          radial-gradient(
            ellipse 900px 500px at 50% -60px,
            hsl(270 100% 50% / 0.12) 0%,
            transparent 70%
          ),
          linear-gradient(180deg, hsl(215 28% 7%) 0%, hsl(215 28% 5%) 100%);
        z-index: 0;
      }

      /* ── Scene 1: intro ── */
      .intro-center {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
      }

      #oa-logo-intro {
        width: 160px;
        height: auto;
      }

      #tagline-intro {
        font-size: 48px;
        font-weight: 700;
        color: hsl(210 40% 98%);
        letter-spacing: 2px;
      }

      /* ── Scene 2: main layout ── */
      .layout {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        padding: 120px 80px 100px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        overflow: hidden;
      }

      /* League row */
      #league-row {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 72px;
        width: 100%;
      }

      #league-logo {
        width: 56px;
        height: 56px;
        object-fit: contain;
        flex-shrink: 0;
      }

      #league-info {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
      }

      #league-name {
        font-size: 32px;
        font-weight: 700;
        color: hsl(210 40% 98%);
      }

      #round-label {
        font-size: 24px;
        font-weight: 400;
        color: hsl(215 20% 65%);
      }

      #app-icon {
        width: 100px;
        height: 100px;
        object-fit: contain;
        flex-shrink: 0;
      }

      /* Team rows */
      #home-row,
      #away-row {
        display: flex;
        align-items: center;
        gap: 28px;
        margin-bottom: 24px;
        width: 100%;
      }

      #home-logo,
      #away-logo {
        width: 96px;
        height: 96px;
        object-fit: contain;
        flex-shrink: 0;
      }

      #home-name,
      #away-name {
        font-size: 64px;
        font-weight: 700;
        color: hsl(210 40% 98%);
        line-height: 1.1;
      }

      /* Divider rules */
      #divider-rule,
      #divider-rule-2 {
        width: 100%;
        height: 1px;
        background: hsl(215 25% 18%);
        margin-bottom: 56px;
        flex-shrink: 0;
      }

      #divider-rule {
        margin-top: 16px;
      }

      /* Kickoff */
      #kickoff-time {
        font-size: 64px;
        font-weight: 700;
        color: hsl(210 40% 98%);
        letter-spacing: -3px;
        line-height: 1;
        margin-bottom: 12px;
        display: block;
      }

      #kickoff-date {
        font-size: 32px;
        font-weight: 500;
        color: hsl(215 20% 65%);
        margin-bottom: 48px;
        display: block;
      }

      /* Channels */
      #channels-label {
        font-size: 32px;
        font-weight: 600;
        letter-spacing: 0px;
        color: hsl(142 70% 50%);
        margin-bottom: 48px;
        display: block;
      }

      #channels-list {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-bottom: 52px;
        width: 100%;
      }

      .channel-item {
        display: flex;
        align-items: center;
        gap: 20px;
        width: 100%;
      }

      .channel-logo {
        width: 96px;
        height: 104px;
        object-fit: contain;
        flex-shrink: 0;
        border-radius: 20px;
      }

      .channel-name {
        font-size: 32px;
        font-weight: 700;
        color: hsl(210 40% 98%);
      }

      .free-badge {
        font-size: 20px;
        font-weight: 600;
        color: hsl(142 70% 50%);
        background: hsl(142 70% 50% / 0.12);
        border: 1px solid hsl(142 70% 50% / 0.3);
        border-radius: 999px;
        padding: 4px 16px;
        margin-left: auto;
        flex-shrink: 0;
      }

      /* App CTA */
      #app-cta {
        display: flex;
        flex-direction: column;
        gap: 40px;
      }

      #cta-text {
        font-size: 32px;
        font-weight: 600;
        color: hsl(210 40% 98%);
        display: block;
      }

      #gplay-badge {
        height: 80px;
        width: auto;
      }

      /* Footer */
      #oa-footer {
        position: absolute;
        bottom: 72px;
        left: 80px;
        right: 80px;
        display: flex;
        align-items: center;
        gap: 20px;
        z-index: 2;
      }

      .footer-logo-img {
        height: 56px;
        width: auto;
        opacity: 0.7;
      }

      .footer-domain {
        font-size: 32px;
        font-weight: 600;
        color: hsl(270 100% 68%);
      }
    </style>
  </head>
  <body>
    <div
      data-composition-id="match-reel"
      data-duration="12"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <!-- Wipe blocks (cover transition overlay) -->
      <div id="wipe-a"></div>
      <div id="wipe-b"></div>

      <!-- Scene 1: Brand logo intro -->
      <div id="scene1" class="scene">
        <div class="scene-bg"></div>
        <div class="intro-center">
          <img
            id="oa-logo-intro"
            src="https://imagedelivery.net/d9gC2EGekkZoINfC-sskXg/ui/logo-roxo.svg/public"
            alt="Onde Assistir"
          />
          <p id="tagline-intro">Onde Assistir Futebol Ao Vivo</p>
        </div>
      </div>

      <!-- Scene 2: Match info -->
      <div id="scene2" class="scene">
        <div class="scene-bg"></div>

        <div class="layout">
          <!-- League -->
          <div id="league-row">
            <img id="league-logo" src="{{LEAGUE_LOGO_URL}}" alt="Liga" />
            <div id="league-info">
              <span id="league-name">{{LEAGUE_NAME}}</span>
              <span id="round-label">{{ROUND}}</span>
            </div>
            <img
              id="app-icon"
              src="https://imagedelivery.net/d9gC2EGekkZoINfC-sskXg/ui/ic_launcher-playstore-reel.png/public"
              alt=""
            />
          </div>

          <!-- Teams -->
          <div id="home-row">
            <img id="home-logo" src="{{HOME_LOGO_URL}}" alt="{{HOME_TEAM}}" />
            <span id="home-name">{{HOME_TEAM}}</span>
          </div>
          <div id="away-row">
            <img id="away-logo" src="{{AWAY_LOGO_URL}}" alt="{{AWAY_TEAM}}" />
            <span id="away-name">{{AWAY_TEAM}}</span>
          </div>

          <!-- Divider -->
          <div id="divider-rule"></div>

          <!-- Kickoff -->
          <span id="kickoff-time">{{KICKOFF_TIME}}</span>
          <span id="kickoff-date">{{KICKOFF_DATE}}</span>

          <!-- Divider -->
          <div id="divider-rule-2"></div>

          <!-- Channels -->
          <span id="channels-label">Onde Assistir Ao Vivo</span>
          <div id="channels-list">{{CHANNELS_HTML}}</div>

          <!-- App CTA -->
          <div id="app-cta">
            <span id="cta-text">Baixe o app! 100% Grátis</span>
            <img
              id="gplay-badge"
              src="https://imagedelivery.net/d9gC2EGekkZoINfC-sskXg/ui/googleplay-badge.svg/public"
              alt="Disponível no Google Play"
            />
          </div>
        </div>

        <!-- Footer branding -->
        <div id="oa-footer">
          <img
            class="footer-logo-img"
            src="https://img.ondeassistir.tv/images-scr/favicon/favicon.svg"
            alt="Onde Assistir"
          />
          <span class="footer-domain">www.ondeassistir.tv</span>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ── Phase 1: 3D logo flip ──────────────────────────────────────────

      // Park wipe blocks offscreen from frame 0
      tl.set("#wipe-a, #wipe-b", { x: -1080 }, 0);

      tl.set("#oa-logo-intro", { rotationY: -90, opacity: 0, transformPerspective: 600 }, 0);
      tl.to(
        "#oa-logo-intro",
        { rotationY: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
        0.15,
      );

      tl.fromTo(
        "#tagline-intro",
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
        0.7,
      );

      // t=1.2 → t=1.8: stillness — breathe

      // ── Phase 2: Cover transition ─────────────────────────────────────────

      var T = 1.8;

      tl.set("#wipe-a", { x: -1080 }, T - 0.01);
      tl.set("#wipe-b", { x: -1080 }, T - 0.01);
      tl.to("#wipe-a", { x: 0, duration: 0.25, ease: "power3.inOut" }, T);
      tl.to("#wipe-b", { x: 0, duration: 0.25, ease: "power3.inOut" }, T + 0.06);
      tl.set("#scene1", { opacity: 0 }, T + 0.2);
      tl.set("#scene2", { opacity: 1 }, T + 0.2);
      tl.to("#wipe-a", { x: 1080, duration: 0.25, ease: "power3.inOut" }, T + 0.28);
      tl.to("#wipe-b", { x: 1080, duration: 0.25, ease: "power3.inOut" }, T + 0.34);

      // ── Phase 3: Scene 2 build ────────────────────────────────────────────

      var S = 2.4;

      // League row — left anchor, contextual first
      tl.fromTo(
        "#league-row",
        { x: -40, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        S + 0.1,
      );

      // Teams — fast, expo.out = confident
      tl.fromTo(
        "#home-row",
        { x: -50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" },
        S + 0.45,
      );
      tl.fromTo(
        "#away-row",
        { x: -50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" },
        S + 0.57,
      );

      // Divider draws in from left
      tl.set("#divider-rule", { scaleX: 0, transformOrigin: "left center" }, S);
      tl.to(
        "#divider-rule",
        { scaleX: 1, duration: 0.5, ease: "power2.inOut" },
        S + 0.7,
      );

      // Kickoff time — gravity/weight, slow entrance
      tl.fromTo(
        "#kickoff-time",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        S + 0.9,
      );

      // Date — lighter, faster follow
      tl.fromTo(
        "#kickoff-date",
        { x: -20, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.3, ease: "power2.out" },
        S + 1.15,
      );

      // Second divider
      tl.set("#divider-rule-2", { scaleX: 0, transformOrigin: "left center" }, S);
      tl.to(
        "#divider-rule-2",
        { scaleX: 1, duration: 0.4, ease: "power2.inOut" },
        S + 1.35,
      );

      // Channels label
      tl.fromTo(
        "#channels-label",
        { x: -25, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.3, ease: "power2.out" },
        S + 1.5,
      );

      // Channel items — staggered from left
      tl.fromTo(
        ".channel-item",
        { x: -35, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.35, ease: "power2.out", stagger: 0.1 },
        S + 1.65,
      );

      // App CTA
      tl.fromTo(
        "#app-cta",
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" },
        S + 2.5,
      );

      // Footer
      tl.fromTo(
        "#oa-footer",
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: "sine.out" },
        S + 2.8,
      );

      // ── Phase 4: Breathe — ambient glow pulse ─────────────────────────────

      tl.to(
        "#scene2 .scene-bg",
        { scale: 1.06, duration: 3.5, ease: "sine.inOut", yoyo: true, repeat: -1 },
        S + 2.8,
      );

      window.__timelines["match-reel"] = tl;
    </script>
  </body>
</html>
