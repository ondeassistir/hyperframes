<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>{{LEAGUE_NAME}} — Jogos do Dia</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap");

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: hsl(215 28% 7%);
      }

      [data-composition-id="league-reel"] {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        position: relative;
        font-family: "Sora", sans-serif;
        color: hsl(210 40% 98%);
        background: hsl(215 28% 7%);
      }

      .scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      .league-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
        opacity: 0;
      }

      .scene-bg {
        position: absolute;
        inset: 0;
        transform-origin: center center;
        background:
          radial-gradient(
            ellipse 900px 500px at 50% -60px,
            hsl(270 100% 50% / 0.12) 0%,
            transparent 70%
          ),
          linear-gradient(180deg, hsl(215 28% 7%) 0%, hsl(215 28% 5%) 100%);
        z-index: 1;
      }

      .scene-match .scene-bg {
        background:
          radial-gradient(
            ellipse 900px 500px at 50% -60px,
            hsl(270 100% 50% / 0.18) 0%,
            transparent 70%
          ),
          linear-gradient(180deg, hsl(215 28% 7% / 0.78) 0%, hsl(215 28% 5% / 0.88) 100%);
      }

      /* ── Intro scene ── */
      .intro-center {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
      }

      #oa-logo-intro { width: 160px; height: auto; }
      #tagline-intro { font-size: 48px; font-weight: 700; color: hsl(210 40% 98%); letter-spacing: 2px; }

      /* ── Match scene layout ── */
      .layout {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        padding: 120px 80px 100px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        overflow: hidden;
      }

      .league-row { display: flex; align-items: center; gap: 20px; margin-bottom: 72px; width: 100%; }
      .league-logo { width: 80px; height: 80px; object-fit: contain; flex-shrink: 0; }
      .league-info { display: flex; flex-direction: column; gap: 6px; flex: 1; }
      .league-name-el { font-size: 32px; font-weight: 700; color: hsl(210 40% 98%); }
      .round-label { font-size: 24px; font-weight: 400; color: hsl(215 20% 65%); }
      .app-icon { width: 100px; height: 100px; object-fit: contain; flex-shrink: 0; }

      .home-row, .away-row { display: flex; align-items: center; gap: 28px; margin-bottom: 24px; width: 100%; }
      .home-logo, .away-logo { width: 96px; height: 96px; object-fit: contain; flex-shrink: 0; }
      .home-name, .away-name { font-size: 64px; font-weight: 700; color: hsl(210 40% 98%); line-height: 1.1; }

      .divider-rule, .divider-rule-2 { width: 100%; height: 1px; background: hsl(215 25% 18%); margin-bottom: 56px; flex-shrink: 0; }
      .divider-rule { margin-top: 16px; }

      .kickoff-time { font-size: 64px; font-weight: 700; color: hsl(210 40% 98%); letter-spacing: -3px; line-height: 1; margin-bottom: 12px; display: block; }
      .kickoff-date { font-size: 32px; font-weight: 500; color: hsl(215 20% 65%); margin-bottom: 48px; display: block; }

      .channels-label { font-size: 32px; font-weight: 600; color: hsl(142 70% 50%); margin-bottom: 48px; display: block; }
      .channels-list { display: flex; flex-direction: column; gap: 20px; margin-bottom: 52px; width: 100%; }

      .channel-item { display: flex; align-items: center; gap: 20px; width: 100%; }
      .channel-logo { width: 96px; height: 104px; object-fit: contain; flex-shrink: 0; border-radius: 20px; }
      .channel-name { font-size: 32px; font-weight: 700; color: hsl(210 40% 98%); }
      .free-badge { font-size: 20px; font-weight: 600; color: hsl(142 70% 50%); background: hsl(142 70% 50% / 0.12); border: 1px solid hsl(142 70% 50% / 0.3); border-radius: 999px; padding: 4px 16px; margin-left: auto; flex-shrink: 0; }

      .app-cta { display: flex; flex-direction: column; gap: 40px; align-items: flex-start; }
      .cta-text { font-size: 32px; font-weight: 600; color: hsl(210 40% 98%); display: block; }
      .gplay-badge { height: 80px; width: auto; }

      .oa-footer { position: absolute; bottom: 72px; left: 80px; right: 80px; display: flex; align-items: center; gap: 20px; z-index: 2; }
      .footer-logo-img { height: 56px; width: auto; opacity: 0.7; }
      .footer-domain { font-size: 32px; font-weight: 600; color: hsl(270 100% 68%); }

      /* ── Instagram follow scene ── */
      #follow-card {
        position: absolute;
        bottom: 160px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 24px;
        background: hsl(215 28% 12%);
        border: 1px solid hsl(215 28% 20%);
        border-radius: 48px;
        padding: 28px 40px;
        width: 920px;
      }

      #follow-avatar {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
        background: hsl(270 100% 50% / 0.2);
        padding: 12px;
      }

      #follow-info {
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
      }

      #follow-name { font-size: 36px; font-weight: 700; color: hsl(210 40% 98%); }
      #follow-handle { font-size: 28px; font-weight: 400; color: hsl(215 20% 65%); }

      #follow-btn {
        background: hsl(270 100% 50%);
        color: #fff;
        font-family: "Sora", sans-serif;
        font-size: 30px;
        font-weight: 700;
        border: none;
        border-radius: 32px;
        padding: 20px 48px;
        cursor: pointer;
        flex-shrink: 0;
        position: relative;
      }

      .btn-label {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #btn-following { opacity: 0; }
    </style>
  </head>
  <body>
    <div
      data-composition-id="league-reel"
      data-duration="{{COMPOSITION_DURATION}}"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      {{SCENES_HTML}}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      {{GSAP_SCRIPT}}
      window.__timelines["league-reel"] = tl;
    </script>
  </body>
</html>
