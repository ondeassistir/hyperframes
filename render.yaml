services:
  - type: cron
    name: match-reel-generator
    runtime: docker
    dockerfilePath: ./Dockerfile.generator
    plan: standard  # 2 GB RAM — required for Chromium + FFmpeg rendering
    schedule: "0 6 * * *"  # daily at 06:00 UTC
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: match-videos
      - key: DAYS_AHEAD
        value: "1"
      - key: ENABLED_LEAGUE_IDS
        sync: false  # set league IDs in the Render dashboard (e.g. 71,72,13)
      - key: MAX_RENDERS_PER_RUN
        value: "5"  # cap per run to stay within memory limits (0 = no limit)
